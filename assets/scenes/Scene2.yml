      diffuse: { x: 1.0, y: 0.0, z: 0.0, w: 1.0 }
    - position: { x: 0.0, y: -3.0, z: 0.0, w: 1.0 }
      diffuse: { x: 0.0, y: 1.0, z: 0.0, w: 1.0 }
    - position: { x: -7.0, y: -3.0, z: 0.0, w: 1.0 }
      diffuse: { x: 0.0, y: 0.0, z: 1.0, w: 1.0 }
  shaders:
