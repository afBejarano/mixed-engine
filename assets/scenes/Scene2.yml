    camera:
      eye: { x: 0.0, y: -1.0, z: -10.0 }
      center: { x: 0.0, y: -1.0, z: 0.0 }
      up: { x: 0.0, y: -1.0, z: 0.0 }
    perspective: { fov: 60.0, zNear: 0.1, zFar: 100 }
    skybox:
      right: "assets/skyboxes/Underwater/Underwater Box_Posx.png"
      left: "assets/skyboxes/Underwater/Underwater Box_Negx.png"
      top: "assets/skyboxes/Underwater/Underwater Box_Posy.png"
      bottom: "assets/skyboxes/Underwater/Underwater Box_Negy.png"
      front: "assets/skyboxes/Underwater/Underwater Box_Posz.png"
      back: "assets/skyboxes/Underwater/Underwater Box_Negz.png"
  actors:
    - object:
        obj: "./assets/Spaceship/Intergalactic_Spaceship-(Wavefront).obj"
        basedir: "./assets/Spaceship/"
      transform:
        position: { x: -5.0, y: 0.0, z: 0.0 }
        orientation: { x: 0.0, y: 0.0, z: 0.0 }
        scale: { x: 1.0, y: 1.0, z: 1.0 }
    - object:
        obj: "./assets/Spider/spider.obj"
        basedir: "./assets/Spider/"
      transform:
        position: { x: 5.0, y: 0.0, z: 0.0 }
        orientation: { x: 0.0, y: 90.0, z: 0.0 }
        scale: { x: 0.05, y: 0.05, z: 0.05 }
  lights:
